name: build

# Construit l'image de la console d'administration Ceffio et la publie sur GHCR.
#
# POURQUOI CE DEPOT EXISTE SÉPARÉMENT : la console n'est pas un service
# autonome — elle embarque le binaire `ceffio` (c'est lui qui porte la page web
# et la logique d'administration). Ce dépôt ne contient donc PAS le code : il
# porte le workflow qui construit ce binaire, l'emballe en image et la publie.
# Le résultat est une image adressable et versionnée, que le déploiement peut
# tirer sans rien reconstruire sur la machine cible.
#
# Tag = version : règle du projet. Une image sans version ne peut être ni
# comparée, ni mise à niveau de façon reproductible.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: "Version à publier (ex. 0.3.0). Vide = dérivée du tag."
        required: false

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer ce dépôt
        uses: actions/checkout@v4

      - name: Installer Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      # On CONSTRUIT le binaire depuis les sources plutôt que de le télécharger :
      # l'image correspond alors exactement à un commit connu, et l'on sait
      # reproduire la même image plus tard.
      # Le depot ceffio est PRIVE : le clone a besoin d'un jeton. On reutilise
      # GHCR_TOKEN, qui a deja le scope repo — inutile d'en ajouter un second
      # pour le meme compte. Le jeton est retire de l'URL apres le clone pour
      # qu'il n'apparaisse dans aucun log.
      - name: Récupérer et construire Ceffio
        run: |
          set -eu
          TOKEN="${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}"
          git clone --depth 1 \
            "https://x-access-token:${TOKEN}@github.com/ceffio-suite/ceffio.git" /tmp/ceffio
          cd /tmp/ceffio
          git remote set-url origin https://github.com/ceffio-suite/ceffio.git
          mkdir -p /tmp/ctx/usr/local/bin
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build \
            -buildvcs=false -trimpath -ldflags="-s -w" \
            -o /tmp/ctx/usr/local/bin/ceffio ./cmd/ceffio
          ls -la /tmp/ctx/usr/local/bin/ceffio

      - name: Déterminer la version
        id: version
        run: |
          set -eu
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          elif [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION="0.0.0-$(git rev-parse --short HEAD)"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Version : ${VERSION}"

      # L'image part d'un système VIDE : le binaire est statique
      # (CGO_ENABLED=0), il n'a besoin d'aucune bibliothèque système. Pour une
      # console d'administration joignable en réseau, réduire la surface
      # d'attaque à presque rien n'est pas un détail — et une image vide ne
      # peut pas embarquer un shell qu'on aurait oublié d'y laisser.
      - name: Écrire le Dockerfile
        run: |
          cat > /tmp/ctx/Dockerfile <<'DOCKERFILE'
          FROM alpine:3.20 AS certs
          FROM scratch
          # Les autorités de certification : la console appelle l'API Kubernetes
          # et Keycloak en HTTPS, elle doit vérifier leurs certificats.
          COPY --from=certs /etc/ssl/certs/ca-certificates.crt /etc/ssl/certs/ca-certificates.crt
          COPY usr/local/bin/ceffio /usr/local/bin/ceffio
          EXPOSE 8088
          ENTRYPOINT ["/usr/local/bin/ceffio"]
          CMD ["console", "--addr", ":8088"]
          DOCKERFILE
          cat /tmp/ctx/Dockerfile

      # Token dédié plutôt que le GITHUB_TOKEN : la politique de l'organisation
      # peut restreindre ce dernier, et c'est une bonne pratique qu'on ne
      # préfère pas affaiblir pour faire passer un build.
      - name: Publier sur GHCR
        run: |
          set -eu
          IMAGE="ghcr.io/ceffio-suite/ceffio-console"
          VERSION="${{ steps.version.outputs.version }}"

          # Meme jeton que pour le clone : un seul secret suffit.
          echo "${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}" | \
            docker login ghcr.io -u "${{ github.actor }}" --password-stdin

          docker buildx build --platform linux/amd64 \
            -t "${IMAGE}:${VERSION}" \
            -t "${IMAGE}:latest" \
            --push /tmp/ctx

          echo "Publié : ${IMAGE}:${VERSION}"