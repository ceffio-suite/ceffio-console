name: build

# Builds the Ceffio administration console image and publishes it to GHCR.
#
# WHY THIS REPOSITORY EXISTS SEPARATELY: the console is not a standalone
# service — it embeds the `ceffio` binary (which carries the web page and the
# administration logic). This repository therefore does NOT contain the code:
# it carries the workflow that builds this binary, packages it as an image and
# publishes it. The result is an addressable, versioned image that the
# deployment can pull without rebuilding anything on the target machine.
#
# Tag = version: project rule. An image without a version can neither be
# compared nor upgraded reproducibly.

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g. 0.3.0). Empty = derived from the tag."
        required: false

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out this repository
        uses: actions/checkout@v4

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      # We BUILD the binary from source rather than downloading it: the image
      # then corresponds exactly to a known commit, and the same image can be
      # reproduced later.
      # The ceffio repository is PRIVATE: the clone needs a token. We reuse
      # GHCR_TOKEN, which already has the repo scope — no need to add a second
      # one for the same account. The token is removed from the URL after the
      # clone so that it never appears in any log.
      - name: Fetch and build Ceffio
        run: |
          set -eu
          TOKEN="${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}"
          git clone --depth 1 \
            "https://x-access-token:${TOKEN}@github.com/ceffio-suite/ceffio.git" /tmp/ceffio
          cd /tmp/ceffio
          git remote set-url origin https://github.com/ceffio-suite/ceffio.git
          mkdir -p /tmp/ctx/usr/local/bin
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build \
            -buildvcs=false -trimpath -ldflags="-s -w" \
            -o /tmp/ctx/usr/local/bin/ceffio ./cmd/ceffio
          ls -la /tmp/ctx/usr/local/bin/ceffio

      - name: Determine the version
        id: version
        run: |
          set -eu
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          elif [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION="0.0.0-$(git rev-parse --short HEAD)"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Version: ${VERSION}"

      # The image starts from an EMPTY system: the binary is static
      # (CGO_ENABLED=0), it needs no system library. For an administration
      # console reachable over the network, reducing the attack surface to
      # almost nothing is not a detail — and an empty image cannot embed a
      # shell we might have forgotten to leave there.
      - name: Write the Dockerfile
        run: |
          cat > /tmp/ctx/Dockerfile <<'DOCKERFILE'
          FROM alpine:3.20 AS certs
          FROM scratch
          # The certificate authorities: the console calls the Kubernetes API
          # and Keycloak over HTTPS, it must verify their certificates.
          COPY --from=certs /etc/ssl/certs/ca-certificates.crt /etc/ssl/certs/ca-certificates.crt
          COPY usr/local/bin/ceffio /usr/local/bin/ceffio
          EXPOSE 8088
          ENTRYPOINT ["/usr/local/bin/ceffio"]
          CMD ["console", "--addr", ":8088"]
          DOCKERFILE
          cat /tmp/ctx/Dockerfile

      # Dedicated token rather than the GITHUB_TOKEN: the organization policy
      # may restrict the latter, and it is a good practice we prefer not to
      # weaken to make a build pass.
      - name: Publish to GHCR
        run: |
          set -eu
          IMAGE="ghcr.io/ceffio-suite/ceffio-console"
          VERSION="${{ steps.version.outputs.version }}"

          # Same token as for the clone: a single secret is enough.
          echo "${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}" | \
            docker login ghcr.io -u "${{ github.actor }}" --password-stdin

          docker buildx build --platform linux/amd64 \
            -t "${IMAGE}:${VERSION}" \
            -t "${IMAGE}:latest" \
            --push /tmp/ctx

          echo "Published: ${IMAGE}:${VERSION}"